[package]
name = "armature-collab"
version = "0.4.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-collab"
homepage = "https://quinnjr.github.io/armature"
description = "Real-time collaboration with CRDTs and Operational Transformation for Armature framework"
keywords = ["crdt", "collaboration", "real-time", "ot", "sync"]
categories = ["data-structures", "web-programming"]

[dependencies]
armature-core = { version = "0.9" }
armature-log = { version = "0.2" }
armature-websocket = { version = "0.3", optional = true }
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.2"
parking_lot = "0.12"
bytes = "1.12"

# For text CRDTs
ropey = { version = "1.6", optional = true }

[features]
default = ["text"]
text = ["ropey"]
websocket = ["armature-websocket"]
full = ["text", "websocket"]

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"
proptest = "1.11"

